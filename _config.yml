# GitHub Pages (Jekyll): keep internal docs out of the published site.
# install.sh at the root is published on purpose (https://ive.dev/install.sh); never exclude it.
exclude:
  - README.md
  - DESIGN.md
  - .gitignore
  - scripts
  - worker
  - wrangler.jsonc
  - package.json
  - package-lock.json
  - subscriber-exports
  - node_modules
  - waitlist-exports
  - design
  - review
